name: Feed Zeref

# Drop box for books / texts Zeref may READ (never train on). See zeref/feed/README.md.
# - A "Feed Zeref" issue (form) -> the one file is checked (TXT/PDF/EPUB/ZIP, <=100 MB,
#   no executables), stored as a release asset (tag zeref-feed, never plain git), and a
#   manifest lands in zeref/feed/inbox/<id>/ with the label feed:pending.
# - Only NavisWORLD (repo owner) can comment /approve or /reject.
# - The reading index is rebuilt from APPROVED items only.
# Issue text is read from the event JSON by Python, never interpolated into a shell.
# Commits touch only zeref/feed/** and assets/zeref-feed*.svg.
on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: zeref-profile-commit
  cancel-in-progress: false

jobs:
  feed:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.sender.type != 'Bot' &&
      (startsWith(github.event.issue.title, '[Feed]') ||
       contains(github.event.issue.labels.*.name, 'feed-zeref')) &&
      (github.event_name == 'issues' ||
       startsWith(github.event.comment.body, '/approve') ||
       startsWith(github.event.comment.body, '/reject'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pdftotext (reading index only)
        run: sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: Intake or owner command
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ github.event_name == 'issues' && 'intake' || 'command' }}
        run: python scripts/zeref/feed.py "$MODE"
      - name: Rebuild the reading index (approved items only) and the counts
        run: |
          python scripts/zeref/feed.py index
          python scripts/zeref/feed.py status
      - name: Check the profile still passes
        run: python scripts/check_profile.py
      - name: Commit only feed records, index and counts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A zeref/feed assets/zeref-feed.svg assets/zeref-feed-mobile.svg
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Feed Zeref: update quarantine records and counts"
          for i in 1 2 3; do git pull --rebase --quiet origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1

name: Zeref runner probe (temporary)
on:
  pull_request:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Card dry run from a GitHub runner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/zeref/refresh_card.py --out /tmp/zeref-dry && cat /tmp/zeref-dry/zeref/live.json
      - name: One talk from a GitHub runner (throwaway thread key)
        run: python3 scripts/zeref/talk_reply.py --local-test "Hi Zeref, this is a test visit from a GitHub runner. How are you?"

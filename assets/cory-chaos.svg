<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="t d"><title id="t">Cory's animated cosmic workbench</title><desc id="d">A warm cosmic workbench with blinking terminal text, steaming coffee, a bouncing fire-winged Spark Beast and sticky notes reading build, break, learn and repeat.</desc><style>.cursor{animation:blink 1.1s steps(2,end) infinite}.steam{animation:steam 3s ease-in-out infinite}.beast{animation:bob 2.9s ease-in-out infinite;transform-origin:center;transform-box:fill-box}.note{animation:note 5s ease-in-out infinite;transform-origin:center;transform-box:fill-box}.spark{animation:spark 2.5s ease-in-out infinite}@keyframes blink{50%{opacity:.1}}@keyframes steam{0%{opacity:0;transform:translateY(8px)}50%{opacity:.8}100%{opacity:0;transform:translateY(-18px)}}@keyframes bob{50%{transform:translateY(-10px) rotate(1deg)}}@keyframes note{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1deg)}}@keyframes spark{50%{opacity:.2}}@media(prefers-reduced-motion:reduce){.cursor,.steam,.beast,.note,.spark{animation:none!important}}text{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style><defs><linearGradient id="wood" x1="0" x2="1"><stop stop-color="#32170f"/><stop offset=".5" stop-color="#75401e"/><stop offset="1" stop-color="#2a130e"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="360" rx="26" fill="#080c1e" stroke="#3f4e78"/><rect x="25" y="210" width="1150" height="125" rx="18" fill="url(#wood)" stroke="#b36b33"/><rect x="65" y="54" width="500" height="205" rx="18" fill="#071521" stroke="#5be4f0" stroke-width="3"/><text x="95" y="94" fill="#69f1ff" font-size="18">cory@navisworld:~$ ./build-the-weird-thing</text><text x="95" y="130" fill="#a7f7c8" font-size="17">[ok] connected systems that did not ask for this</text><text x="95" y="166" fill="#ffd069" font-size="17">[ok] kept the failed receipt</text><text x="95" y="202" fill="#e69aff" font-size="17">[???] gave the creature a Game Boy</text><rect class="cursor" x="95" y="221" width="12" height="20" fill="#9bffca"/><g class="beast" transform="translate(655 92)" filter="url(#g)"><path d="M55 45L18 5l52 19 34-27-7 55z" fill="#f36c34"/><path d="M38 94q10-50 62-50 58 0 68 52l-25 36H70z" fill="#58413a"/><circle cx="133" cy="70" r="9" fill="#ffd14e"/><path d="M53 72L5 88l44 14z" fill="#e25d2f"/><rect x="76" y="126" width="42" height="20" rx="8" fill="#7b2c43"/><rect x="127" y="126" width="42" height="20" rx="8" fill="#7b2c43"/></g><g transform="translate(890 70)"><rect class="note" width="230" height="170" rx="7" fill="#e8c878" transform="rotate(2 115 85)"/><text x="30" y="45" fill="#3c2815" font-size="20">BUILD</text><text x="30" y="77" fill="#3c2815" font-size="20">BREAK</text><text x="30" y="109" fill="#3c2815" font-size="20">LEARN</text><text x="30" y="141" fill="#3c2815" font-size="20">REPEAT</text></g><g transform="translate(590 228)"><path d="M0 20h72v54H12q-12 0-12-12z" fill="#d8d6cf"/><path d="M72 34q35 0 23 24-8 13-23 10" fill="none" stroke="#d8d6cf" stroke-width="8"/><path class="steam" d="M20 10q12-18 0-34M43 10q12-18 0-34" fill="none" stroke="#fff" stroke-width="4" opacity=".6"/></g><g fill="#ffdc6e"><circle class="spark" cx="620" cy="58" r="4"/><circle class="spark" cx="820" cy="63" r="3" style="animation-delay:1s"/><circle class="spark" cx="1148" cy="40" r="4" style="animation-delay:1.8s"/></g><text x="815" y="320" fill="#d9e5f7" font-size="15">coffee • code • chaos • receipts • tiny beasts</text></svg>
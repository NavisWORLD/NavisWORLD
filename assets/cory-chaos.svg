<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="t d">
<title id="t">Cory's cosmic builder desk</title><desc id="d">A warm animated builder desk with a blinking terminal, steaming coffee, a bouncing Spark Beast, glowing crystals, code notes and a sticky note that says build, break, learn, improve, repeat.</desc>
<style>text{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.cursor{animation:blink 1.1s steps(2,end) infinite}.steam{animation:steam 3s ease-in-out infinite}.beast{animation:bob 3s ease-in-out infinite;transform-origin:center;transform-box:fill-box}.note{animation:note 5s ease-in-out infinite;transform-origin:center;transform-box:fill-box}.tw{animation:tw 2.7s ease-in-out infinite}.scan{stroke-dasharray:8 11;animation:scan 4.5s linear infinite}@keyframes blink{50%{opacity:.12}}@keyframes steam{0%{opacity:0;transform:translateY(8px)}50%{opacity:.85}100%{opacity:0;transform:translateY(-18px)}}@keyframes bob{0%,100%{transform:translateY(0) rotate(-.4deg)}50%{transform:translateY(-9px) rotate(.6deg)}}@keyframes note{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1deg)}}@keyframes tw{0%,100%{opacity:.18}50%{opacity:1}}@keyframes scan{to{stroke-dashoffset:-95}}@media(prefers-reduced-motion:reduce){.cursor,.steam,.beast,.note,.tw,.scan{animation:none!important}}</style>
<defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#070b1b"/><stop offset=".5" stop-color="#171137"/><stop offset="1" stop-color="#080d20"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1200" height="430" rx="28" fill="url(#bg)" stroke="#40547d"/><text x="52" y="50" fill="#f3f8ff" font-size="26" font-weight="900">CORY.EXE // MORE WIRING THAN WISDOM</text><text x="52" y="78" fill="#95a9c8" font-size="14">coffee • code • chaos • receipts • tiny beasts • repeat</text>
<rect x="40" y="105" width="560" height="220" rx="20" fill="#061620" stroke="#58e4ef" stroke-width="3"/><text x="72" y="145" fill="#6bedfb" font-size="18">cory@navisworld:~$ ./build-the-weird-thing</text><text x="72" y="181" fill="#a9f5c9" font-size="16">[ok] connected systems that did not ask for this</text><text x="72" y="216" fill="#ffd36c" font-size="16">[ok] kept the failed receipt</text><text x="72" y="251" fill="#ec9cdd" font-size="16">[???] gave the creature a Game Boy</text><text x="72" y="286" fill="#8deeff" font-size="16">[next] make it understandable without killing the weird</text><rect class="cursor" x="72" y="296" width="12" height="19" fill="#9bffcb"/>
<g class="beast" transform="translate(665 130)" filter="url(#g)"><path d="M57 48L18 5l56 21 36-29-8 58z" fill="#f36c34"/><path d="M39 102q10-56 68-56 64 0 75 58l-28 39H75z" fill="#58413a"/><circle cx="148" cy="77" r="9" fill="#ffd24c"/><path d="M54 78L5 94l46 15z" fill="#e15e30"/><rect x="80" y="137" width="40" height="19" rx="8" fill="#7c2c43"/><rect x="128" y="137" width="40" height="19" rx="8" fill="#7c2c43"/></g>
<g transform="translate(628 304)"><path d="M0 16h74v55H14q-14 0-14-14z" fill="#e4e1d8"/><path d="M74 29q38 0 25 25-8 14-25 11" fill="none" stroke="#e4e1d8" stroke-width="8"/><path class="steam" d="M21 5q12-18 0-34M46 5q12-18 0-34" fill="none" stroke="#fff" stroke-width="4" opacity=".65"/><text x="36" y="48" text-anchor="middle" fill="#41291b" font-size="10">COSMIC</text><text x="36" y="60" text-anchor="middle" fill="#41291b" font-size="10">FUEL</text></g>
<g transform="translate(910 120)"><rect class="note" width="220" height="210" rx="8" fill="#e8c979" transform="rotate(2 110 105)"/><text x="28" y="45" fill="#3c2815" font-size="19">BUILD</text><text x="28" y="78" fill="#3c2815" font-size="19">BREAK</text><text x="28" y="111" fill="#3c2815" font-size="19">LEARN</text><text x="28" y="144" fill="#3c2815" font-size="19">IMPROVE</text><text x="28" y="177" fill="#3c2815" font-size="19">REPEAT</text></g>
<path class="scan" d="M620 105C720 70 815 76 912 110" stroke="#62e7ff" stroke-width="3" fill="none" opacity=".45"/><g fill="#ffda6e"><circle class="tw" cx="638" cy="92" r="4"/><circle class="tw" cx="828" cy="81" r="3" style="animation-delay:.8s"/><circle class="tw" cx="1150" cy="72" r="4" style="animation-delay:1.6s"/><circle class="tw" cx="857" cy="360" r="3" style="animation-delay:2.2s"/></g><text x="600" y="401" text-anchor="middle" fill="#cad7e9" font-size="14">BUILD STRANGE • MEASURE HARD • KEEP THE FAILED RECEIPT • MAKE IT FUN ANYWAY</text>
</svg>
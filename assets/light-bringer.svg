<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">NavisWORLD // COSMIC SYNAPSE // BEAST BOX</title>
<desc id="desc">A maximal cosmic control deck banner with a dragon guardian, orbiting creature core, neural constellations, system telemetry and Beast Box identity.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#02040d"/><stop offset=".42" stop-color="#09051b"/><stop offset=".74" stop-color="#061326"/><stop offset="1" stop-color="#02050c"/>
  </linearGradient>
  <radialGradient id="nebA"><stop offset="0" stop-color="#7c3aed" stop-opacity=".58"/><stop offset=".5" stop-color="#312e81" stop-opacity=".18"/><stop offset="1" stop-opacity="0"/></radialGradient>
  <radialGradient id="nebB"><stop offset="0" stop-color="#06b6d4" stop-opacity=".42"/><stop offset=".55" stop-color="#0e7490" stop-opacity=".13"/><stop offset="1" stop-opacity="0"/></radialGradient>
  <radialGradient id="core"><stop offset="0" stop-color="#fff"/><stop offset=".12" stop-color="#ecfeff"/><stop offset=".28" stop-color="#67e8f9"/><stop offset=".52" stop-color="#a78bfa"/><stop offset=".78" stop-color="#6d28d9"/><stop offset="1" stop-color="#0b1022"/></radialGradient>
  <linearGradient id="dragon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#67e8f9"/><stop offset=".47" stop-color="#c4b5fd"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#67e8f9"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="42"/></filter>
  <pattern id="stars" width="100" height="100" patternUnits="userSpaceOnUse">
    <circle cx="8" cy="16" r="1.2" fill="#fff" opacity=".55"/><circle cx="44" cy="33" r=".8" fill="#67e8f9" opacity=".7"/>
    <circle cx="82" cy="12" r="1" fill="#c4b5fd" opacity=".55"/><circle cx="22" cy="79" r=".9" fill="#fff" opacity=".48"/>
    <circle cx="71" cy="73" r="1.3" fill="#f0abfc" opacity=".5"/>
  </pattern>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
    .sans{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  </style>
</defs>

<rect width="1600" height="900" rx="34" fill="url(#bg)"/>
<rect width="1600" height="900" rx="34" fill="url(#stars)" opacity=".8"/>
<ellipse cx="370" cy="400" rx="520" ry="420" fill="url(#nebA)" filter="url(#soft)"/>
<ellipse cx="1160" cy="330" rx="500" ry="350" fill="url(#nebB)" filter="url(#soft)"/>

<!-- neural constellation -->
<g stroke="url(#line)" stroke-width="2" opacity=".32">
  <path d="M80 150L200 95L315 165L430 108L530 172L640 120"/>
  <path d="M1010 135L1112 88L1227 151L1335 102L1505 170"/>
  <path d="M982 700L1105 636L1204 714L1310 650L1480 730"/>
</g>
<g fill="#e0f2fe" filter="url(#glow)">
  <circle cx="80" cy="150" r="4"/><circle cx="200" cy="95" r="3"/><circle cx="315" cy="165" r="4"/>
  <circle cx="430" cy="108" r="3"/><circle cx="530" cy="172" r="4"/><circle cx="640" cy="120" r="3"/>
  <circle cx="1010" cy="135" r="4"/><circle cx="1112" cy="88" r="3"/><circle cx="1227" cy="151" r="4"/>
  <circle cx="1335" cy="102" r="3"/><circle cx="1505" cy="170" r="4"/>
</g>

<!-- core / beast soul -->
<g transform="translate(455 430)">
  <circle r="188" fill="none" stroke="#67e8f9" stroke-opacity=".2" stroke-width="2"/>
  <ellipse rx="245" ry="86" fill="none" stroke="#a78bfa" stroke-opacity=".55" stroke-width="3" transform="rotate(-18)"/>
  <ellipse rx="220" ry="64" fill="none" stroke="#67e8f9" stroke-opacity=".34" stroke-width="2" transform="rotate(32)"/>
  <ellipse rx="180" ry="44" fill="none" stroke="#f472b6" stroke-opacity=".3" stroke-width="2" transform="rotate(72)"/>
  <circle r="124" fill="#7c3aed" opacity=".11" filter="url(#soft)"/>
  <circle r="88" fill="url(#core)" filter="url(#glow)"/>
  <circle r="20" fill="#fff"/>
  <circle cx="192" cy="-34" r="9" fill="#67e8f9" filter="url(#glow)"/>
  <circle cx="-124" cy="138" r="7" fill="#f472b6" filter="url(#glow)"/>
  <circle cx="52" cy="-204" r="6" fill="#c4b5fd" filter="url(#glow)"/>
</g>

<!-- dragon guardian -->
<g fill="none" stroke="url(#dragon)" stroke-linecap="round" stroke-linejoin="round" opacity=".9">
  <path d="M126 674 C72 554 96 392 206 282 C279 209 380 177 477 204 C391 220 329 263 302 328 C273 399 294 474 348 528 C390 570 443 594 500 600" stroke-width="10"/>
  <path d="M251 314 C165 309 112 269 72 207 C83 286 117 345 184 385" stroke-width="8"/>
  <path d="M320 252 C241 206 204 147 197 82 C257 143 319 173 391 185" stroke-width="8"/>
  <path d="M336 501 C260 542 210 603 190 690 C255 630 326 610 398 621" stroke-width="8"/>
  <path d="M397 254 C358 239 319 248 291 278 C329 265 365 281 380 312 C393 340 389 370 373 394" stroke-width="7"/>
  <path d="M373 394 C430 418 476 452 508 500 C535 541 543 585 529 627" stroke-width="8"/>
  <path d="M302 304 C320 294 340 294 358 305" stroke-width="5"/>
</g>
<circle cx="329" cy="303" r="7" fill="#fff" filter="url(#glow)"/>

<!-- title -->
<text x="72" y="78" class="mono" font-size="21" fill="#8be9ff">&gt; NAVISWORLD // COSMIC SYNAPSE NETWORK</text>
<text x="70" y="788" class="sans" font-size="76" font-weight="900" letter-spacing=".08em" fill="#f5f3ff">NAVISWORLD</text>
<text x="74" y="838" class="mono" font-size="21" letter-spacing=".22em" fill="#a78bfa">BUILD STRANGE • MEASURE HARD • LEAVE A MAP</text>

<!-- right command deck -->
<g transform="translate(825 220)">
  <rect width="690" height="490" rx="24" fill="#050817" fill-opacity=".88" stroke="#6d5bd0" stroke-width="2"/>
  <rect width="690" height="64" rx="24" fill="#0c1023"/>
  <circle cx="622" cy="32" r="7" fill="#67e8f9"/><circle cx="648" cy="32" r="7" fill="#a78bfa"/><circle cx="674" cy="32" r="7" fill="#f472b6"/>
  <text x="28" y="41" class="mono" font-size="22" fill="#c4b5fd">LIVING_COSMOS.exe</text>

  <text x="32" y="112" class="mono" font-size="18" fill="#67e8f9">BEAST BOX</text>
  <text x="232" y="112" class="mono" font-size="18" fill="#e5e7eb">persistent companions + worlds</text>
  <line x1="30" y1="136" x2="660" y2="136" stroke="#23284b"/>

  <text x="32" y="182" class="mono" font-size="18" fill="#a78bfa">BRAIN BAY</text>
  <text x="232" y="182" class="mono" font-size="18" fill="#e5e7eb">model-swappable intelligence</text>
  <line x1="30" y1="206" x2="660" y2="206" stroke="#23284b"/>

  <text x="32" y="252" class="mono" font-size="18" fill="#f472b6">LOST COSMOS</text>
  <text x="232" y="252" class="mono" font-size="18" fill="#e5e7eb">game world + creature continuity</text>
  <line x1="30" y1="276" x2="660" y2="276" stroke="#23284b"/>

  <text x="32" y="322" class="mono" font-size="18" fill="#67e8f9">SYNAPSE OS</text>
  <text x="232" y="322" class="mono" font-size="18" fill="#e5e7eb">local machine layer</text>
  <line x1="30" y1="346" x2="660" y2="346" stroke="#23284b"/>

  <text x="32" y="392" class="mono" font-size="18" fill="#a78bfa">CST</text>
  <text x="232" y="392" class="mono" font-size="18" fill="#e5e7eb">state • recurrence • coupling</text>
  <line x1="30" y1="416" x2="660" y2="416" stroke="#23284b"/>

  <text x="32" y="458" class="mono" font-size="16" fill="#94a3b8">MODEL ≠ MEMORY  •  MODEL ≠ STATE  •  MODEL ≠ AUTHORITY</text>
</g>

<text x="828" y="760" class="mono" font-size="18" fill="#67e8f9">THE LIVING COSMOS // CORY SHANE DAVIS</text>
<text x="828" y="796" class="mono" font-size="16" fill="#c4b5fd">“If it should not fit together, I probably want to connect it.”</text>
<text x="828" y="829" class="mono" font-size="15" fill="#64748b">BEAST BOX • COSMOS • CST • LOST COSMOS • LOCAL AI</text>

<rect x="1" y="1" width="1598" height="898" rx="33" fill="none" stroke="#27305b" stroke-width="2"/>
</svg>
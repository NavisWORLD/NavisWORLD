<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 650" role="img" aria-labelledby="t d">
<title id="t">NavisWORLD living cosmic workshop</title>
<desc id="d">A warm animated cosmic inventor workshop. A fire-winged QBEAST glows at the center while Brain Bay, Lost COSMOS, Cosmic Synapse Theory, simulation provenance, Synapse OS and Cory's builder desk surround it as connected rooms.</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.tw{animation:tw 3s ease-in-out infinite}.float{animation:float 4.5s ease-in-out infinite;transform-origin:center;transform-box:fill-box}.beast{animation:beast 3.4s ease-in-out infinite;transform-origin:center;transform-box:fill-box}.wire{stroke-dasharray:9 12;animation:flow 6s linear infinite}.scan{animation:scan 5s linear infinite}.steam{animation:steam 3s ease-in-out infinite}.portal{animation:portal 4s ease-in-out infinite;transform-origin:center;transform-box:fill-box}.crystal{animation:crystal 3.6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes beast{0%,100%{transform:translateY(0) rotate(-.4deg)}50%{transform:translateY(-9px) rotate(.5deg)}}@keyframes flow{to{stroke-dashoffset:-126}}@keyframes scan{from{transform:translateX(-110px)}to{transform:translateX(440px)}}@keyframes steam{0%{opacity:0;transform:translateY(7px)}50%{opacity:.8}100%{opacity:0;transform:translateY(-15px)}}@keyframes portal{0%,100%{opacity:.65;transform:scale(.97)}50%{opacity:1;transform:scale(1.03)}}@keyframes crystal{0%,100%{opacity:.6;transform:scale(.96)}50%{opacity:1;transform:scale(1.06)}}@media(prefers-reduced-motion:reduce){.tw,.float,.beast,.wire,.scan,.steam,.portal,.crystal{animation:none!important}}
</style>

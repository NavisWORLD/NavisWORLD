<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" role="img" aria-labelledby="t d"><title id="t">NavisWORLD workshop cable divider</title><desc id="d">A tiny Spark Beast chases a pulse along a glowing cable with Cory's note that he probably should not connect these systems but connected them anyway.</desc><style>.cable{stroke-dasharray:8 11;animation:flow 4s linear infinite}.runner{animation:run 8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.star{animation:star 2.6s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-114}}@keyframes run{0%,100%{transform:translateX(0)}50%{transform:translateX(760px)}}@keyframes star{0%,100%{opacity:.15}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.cable,.runner,.star{animation:none!important}}</style><rect width="1200" height="150" rx="22" fill="#080c20" stroke="#304976"/><path class="cable" d="M90 78C245 22 367 135 528 77S841 22 1110 76" stroke="#6be9ff" stroke-width="4" fill="none"/><g class="runner" transform="translate(115 42)"><path d="M25 27L8 8l25 8 15-13-2 27z" fill="#f16c36"/><path d="M17 49q5-21 28-21 27 0 31 22L65 64H32z" fill="#58413a"/><circle cx="59" cy="40" r="4" fill="#ffd14d"/></g><g fill="#ffd76b"><circle class="star" cx="350" cy="35" r="4"/><circle class="star" cx="787" cy="112" r="4" style="animation-delay:1.1s"/><circle class="star" cx="1060" cy="42" r="3" style="animation-delay:2s"/></g><text x="600" y="132" text-anchor="middle" fill="#c9d8ee" font-family="system-ui,sans-serif" font-size="15" font-weight="700">probably should not connect these — connected them anyway</text></svg>
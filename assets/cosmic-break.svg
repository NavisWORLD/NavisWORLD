<linearGradient id="brass" x2=".8" y2="1"><stop stop-color="#fff0b0"/><stop offset=".25" stop-color="#d9a95c"/><stop offset=".6" stop-color="#886031"/><stop offset="1" stop-color="#edc685"/></linearGradient>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
<title id="t">Beast Box continuity map</title>
<desc id="d">The persistent creature keeps identity, state and memory references outside a replaceable model slot and moves between Beast Cage, Brain Bay, Lost COSMOS and exports.</desc>
<style>
  .wire{stroke-dasharray:10 9;animation:flow 8s linear infinite}
  .beat{animation:beat 4s ease-in-out infinite;transform-origin:center}
  .floatA{animation:floatA 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  .node{animation:nodeGlow 4.2s ease-in-out infinite}
  .spark{animation:spark 2.8s ease-in-out infinite}
  @keyframes floatA{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  @keyframes nodeGlow{0%,100%{opacity:.88}50%{opacity:1}}
  @keyframes spark{0%,100%{opacity:.25}50%{opacity:1}}
  @keyframes flow{to{stroke-dashoffset:-76}}
  @keyframes beat{0%,100%{opacity:.65}50%{opacity:1}}
  @media(prefers-reduced-motion:reduce){.wire,.beat,.floatA,.node,.spark{animation:none!important}}
</style>
<defs>
<linearGradient id="bg" x1="0" x2="1"><stop stop-color="#070c21"/><stop offset="1" stop-color="#130b28"/></linearGradient>
<linearGradient id="g" x1="0" x2="1"><stop stop-color="#5ee7ff"/><stop offset="1" stop-color="#c792ff"/></linearGradient>
</defs>
<rect width="1200" height="520" rx="28" fill="url(#bg)" stroke="#38547f"/>
<text x="55" y="60" fill="#f4f8ff" font-family="system-ui,sans-serif" font-size="28" font-weight="800">ONE CREATURE // MANY BRAINS // MANY WORLDS</text>
<text x="55" y="90" fill="#94a8c6" font-family="system-ui,sans-serif" font-size="16">Persistent identity and state stay outside the replaceable inference slot.</text>
<g class="floatA" transform="translate(55 128)">
<rect width="480" height="300" rx="24" fill="#0b1536" stroke="#5ee7ff" stroke-width="2"/>
<text x="28" y="42" fill="#6deaff" font-family="monospace" font-size="22" font-weight="700">BEAST // PERSISTENT OBJECT</text>
<g fill="#dce9ff" font-family="monospace" font-size="17">
<text x="36" y="83">├── identity + family</text><text x="36" y="112">├── traits + stats</text>
<text x="36" y="141">├── memory references</text><text x="36" y="170">├── evolution state</text>
<text x="36" y="199">├── environment + save state</text><text x="36" y="228">├── QBEAST metadata / provenance</text>
<text x="36" y="257">└── MODEL SLOT → replaceable</text>
</g>
<rect x="255" y="268" width="195" height="18" rx="9" fill="#1b2c4f"/><rect class="beat" x="255" y="268" width="126" height="18" rx="9" fill="url(#g)"/>
</g>
<g stroke="#71ddff" stroke-width="3" fill="none" class="wire">
<path d="M550 200 C650 200 640 152 720 152"/><path d="M550 270 C650 270 650 252 720 252"/>
<path d="M550 340 C650 340 650 352 720 352"/><path d="M550 410 C650 410 650 452 720 452"/>
</g>
<g font-family="system-ui,sans-serif">
<g class="node" transform="translate(735 117)"><rect width="395" height="70" rx="18" fill="#121c3c" stroke="#a78bfa"/><text x="23" y="30" fill="#eae5ff" font-size="18" font-weight="800">BEAST CAGE</text><text x="23" y="54" fill="#aebed6" font-size="14">body • habitat • interaction</text></g>
<g class="node" transform="translate(735 217)"><rect width="395" height="70" rx="18" fill="#121c3c" stroke="#f1a3dd"/><text x="23" y="30" fill="#ffe8f7" font-size="18" font-weight="800">BRAIN BAY</text><text x="23" y="54" fill="#aebed6" font-size="14">local / native / supported model adapters</text></g>
<g class="node" transform="translate(735 317)"><rect width="395" height="70" rx="18" fill="#121c3c" stroke="#f6c56c"/><text x="23" y="30" fill="#fff1ca" font-size="18" font-weight="800">LOST COSMOS</text><text x="23" y="54" fill="#aebed6" font-size="14">same creature • game snapshot • lineage</text></g>
<g class="node" transform="translate(735 417)"><rect width="395" height="70" rx="18" fill="#121c3c" stroke="#68e2ba"/><text x="23" y="30" fill="#d9fff2" font-size="18" font-weight="800">EXPORT / SAVE / DEVICE</text><text x="23" y="54" fill="#aebed6" font-size="14">state may travel; authority stays gated</text></g>
</g>
<g fill="#f6c85d">
 <circle class="spark" cx="690" cy="152" r="5"/><circle class="spark" cx="668" cy="252" r="4" style="animation-delay:.7s"/>
 <circle class="spark" cx="684" cy="352" r="5" style="animation-delay:1.4s"/><circle class="spark" cx="674" cy="452" r="4" style="animation-delay:2.1s"/>
</g>
</svg>
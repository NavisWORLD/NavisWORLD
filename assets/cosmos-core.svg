<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="t d">
<title id="t">Same Beast, different worlds</title><desc id="d">A persistent QBEAST glows at the center while animated signal paths connect Beast Cage, Brain Bay, Lost COSMOS and Save or Device portals. Identity, state and memory references remain outside the replaceable cognition slot.</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wire{stroke-dasharray:10 12;animation:flow 7s linear infinite}.portal{animation:portal 4.4s ease-in-out infinite;transform-origin:center;transform-box:fill-box}.orbit{animation:orbit 20s linear infinite;transform-origin:610px 310px}.beast{animation:bob 3.4s ease-in-out infinite;transform-origin:center;transform-box:fill-box}.tw{animation:tw 3s ease-in-out infinite}.ring{animation:ring 6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}@keyframes flow{to{stroke-dashoffset:-132}}@keyframes portal{0%,100%{opacity:.72;transform:scale(.98)}50%{opacity:1;transform:scale(1.025)}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes bob{0%,100%{transform:translateY(0) rotate(-.5deg)}50%{transform:translateY(-9px) rotate(.5deg)}}@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}@keyframes ring{0%,100%{opacity:.35;transform:scale(.96)}50%{opacity:.85;transform:scale(1.03)}}@media(prefers-reduced-motion:reduce){.wire,.portal,.orbit,.beast,.tw,.ring{animation:none!important}}</style>
<defs><radialGradient id="bg"><stop stop-color="#21134c"/><stop offset=".5" stop-color="#09142f"/><stop offset="1" stop-color="#050817"/></radialGradient><linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#62edff"/><stop offset=".55" stop-color="#8d7dff"/><stop offset="1" stop-color="#f47ed1"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1200" height="600" rx="32" fill="url(#bg)" stroke="#40598b" stroke-width="2"/><text x="52" y="56" fill="#f3f8ff" font-size="31" font-weight="900">SAME BEAST. DIFFERENT WORLDS.</text><text x="52" y="86" fill="#9ab0cf" font-size="16">The creature is the continuity object. Everything else is a room, tool, brain slot or save surface.</text>
<g transform="translate(48 128)"><rect width="310" height="390" rx="24" fill="#08162f" stroke="#59e6ff" stroke-width="2"/><text x="24" y="40" fill="#6cecff" font-size="19" font-weight="900">QBEAST // PERSISTENT OBJECT</text><g fill="#dce9ff" font-size="16"><text x="28" y="84">✦ identity + family</text><text x="28" y="118">✦ traits + stats</text><text x="28" y="152">✦ memory references</text><text x="28" y="186">✦ evolution state</text><text x="28" y="220">✦ environment + save</text><text x="28" y="254">✦ provenance / lineage</text></g><rect x="24" y="292" width="262" height="68" rx="16" fill="#101f42" stroke="#a78cff"/><text x="155" y="321" text-anchor="middle" fill="#eee8ff" font-size="16" font-weight="900">BRAIN SLOT = REPLACEABLE</text><text x="155" y="346" text-anchor="middle" fill="#9ab1d0" font-size="13">model output never becomes identity</text></g>
<g transform="translate(490 185)" filter="url(#g)"><circle class="ring" cx="120" cy="126" r="112" fill="none" stroke="url(#cyan)" stroke-width="7"/><circle cx="120" cy="126" r="92" fill="#12152c" stroke="#f2bf5d" stroke-width="3"/><g class="beast"><path d="M102 82L72 42l49 20 30-26-5 52z" fill="#ff6b35"/><path d="M81 145q8-62 69-62 62 0 74 58l-27 43H112z" fill="#584039"/><path d="M101 119L52 136l45 16z" fill="#df5f31"/><circle cx="182" cy="116" r="9" fill="#ffd24c"/><rect x="116" y="174" width="37" height="18" rx="7" fill="#7b2c43"/><rect x="160" y="174" width="37" height="18" rx="7" fill="#7b2c43"/></g><text x="120" y="230" text-anchor="middle" fill="#fff" font-size="22" font-weight="900">ONE QBEAST ID</text></g>
<g class="orbit" fill="#ffd45f" filter="url(#g)"><circle cx="610" cy="158" r="6"/><circle cx="610" cy="462" r="5"/></g>
<g class="wire" fill="none" stroke-width="3"><path d="M728 215C805 175 845 165 885 165" stroke="#66e8ff"/><path d="M748 298C830 275 858 275 895 275" stroke="#f18bd4"/><path d="M744 376C830 395 850 397 892 397" stroke="#f4c05c"/><path d="M705 444C790 490 850 500 914 500" stroke="#72e2b7"/></g>
<g><g class="portal" transform="translate(880 120)"><rect width="270" height="86" rx="22" fill="#132245" stroke="#67e8ff" stroke-width="2"/><circle cx="46" cy="43" r="23" fill="#12394d" stroke="#67e8ff"/><path d="M35 43h22M46 32v22" stroke="#67e8ff" stroke-width="4"/><text x="84" y="36" fill="#fff" font-size="19" font-weight="900">BEAST CAGE</text><text x="84" y="60" fill="#a7bad2" font-size="13">body • habitat • interaction</text></g><g class="portal" transform="translate(900 232)" style="animation-delay:.7s"><rect width="250" height="86" rx="22" fill="#29172f" stroke="#ef86cf" stroke-width="2"/><circle cx="46" cy="43" r="23" fill="#401f44" stroke="#ef86cf"/><path d="M30 43h32M46 27v32" stroke="#ef86cf" stroke-width="4"/><text x="84" y="36" fill="#fff" font-size="19" font-weight="900">BRAIN BAY</text><text x="84" y="60" fill="#c9b5d0" font-size="13">many brains • one Beast</text></g><g class="portal" transform="translate(895 352)" style="animation-delay:1.4s"><rect width="255" height="86" rx="22" fill="#33250d" stroke="#f4c05c" stroke-width="2"/><circle cx="46" cy="43" r="23" fill="#4a330c" stroke="#f4c05c"/><path d="M31 34h30v22H31zM37 28h18" stroke="#f4c05c" stroke-width="3" fill="none"/><text x="84" y="36" fill="#fff" font-size="19" font-weight="900">LOST COSMOS</text><text x="84" y="60" fill="#d6c7a1" font-size="13">same creature • game lineage</text></g><g class="portal" transform="translate(915 462)" style="animation-delay:2.1s"><rect width="235" height="86" rx="22" fill="#123229" stroke="#72e2b7" stroke-width="2"/><circle cx="46" cy="43" r="23" fill="#163f35" stroke="#72e2b7"/><path d="M46 28v30M32 43h28" stroke="#72e2b7" stroke-width="4"/><text x="84" y="36" fill="#fff" font-size="18" font-weight="900">SAVE / DEVICE</text><text x="84" y="60" fill="#aedaca" font-size="13">state may travel • authority gated</text></g></g>
<g fill="#d7f8ff"><circle class="tw" cx="420" cy="120" r="3"/><circle class="tw" cx="1110" cy="88" r="4" style="animation-delay:1s"/><circle class="tw" cx="805" cy="540" r="3" style="animation-delay:2s"/><circle class="tw" cx="392" cy="520" r="4" style="animation-delay:2.6s"/></g><text x="610" y="575" text-anchor="middle" fill="#dbe7f6" font-size="15" font-weight="800">STATE MAY TRAVEL • INFORMATION MAY TRAVEL • AUTHORITY DOES NOT TRAVEL AUTOMATICALLY</text>
</svg>
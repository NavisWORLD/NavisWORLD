<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="t d">
<title id="t">NavisWORLD model garden</title><desc id="d">Five whimsical model identities displayed with cautious status labels: RAWRPHOS, PHOS, SAMGO, MUSE and SOL.</desc>
<style>
.star{animation:tw 5s ease-in-out infinite}
.bob{animation:bob 3.2s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
.sway{animation:sway 4.1s ease-in-out infinite;transform-origin:50% 100%;transform-box:fill-box}
.glow{animation:glow 2.8s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes glow{0%,100%{opacity:.72}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.star,.bob,.sway,.glow{animation:none!important}}
</style>
<rect width="1200" height="390" rx="28" fill="#080d22" stroke="#3b4d7a"/>
<text x="52" y="58" fill="#eef6ff" font-family="system-ui,sans-serif" font-size="28" font-weight="800">MODEL GARDEN // COMPUTATIONAL FAMILIARS</text>
<text x="52" y="87" fill="#93a7c6" font-family="system-ui,sans-serif" font-size="15">These are ecosystem identities and research/runtime roles — not claims of equal capability or production readiness.</text>
<g font-family="system-ui,sans-serif" text-anchor="middle">
<g transform="translate(50 120)"><rect width="205" height="220" rx="22" fill="#141335" stroke="#a98aff"/><path class="bob" d="M102 45 l18 30 34 2-25 22 8 34-35-18-34 18 8-34-25-22 34-2z" fill="#9e7bff"/><text x="103" y="156" fill="#fff" font-size="20" font-weight="800">RAWRPHØS</text><text x="103" y="184" fill="#c8d3e8" font-size="13">native/local research line</text><text x="103" y="208" fill="#7fe8ff" font-size="12">documented experimental model</text></g>
<g transform="translate(275 120)"><rect width="205" height="220" rx="22" fill="#0e2030" stroke="#5ee7ff"/><circle class="glow" cx="103" cy="84" r="38" fill="#46d8ef"/><circle cx="89" cy="76" r="6" fill="#07101d"/><circle cx="117" cy="76" r="6" fill="#07101d"/><text x="103" y="156" fill="#fff" font-size="20" font-weight="800">PHOS</text><text x="103" y="184" fill="#c8d3e8" font-size="13">NavisWORLD research identity</text><text x="103" y="208" fill="#7fe8ff" font-size="12">artifacts ≠ production claim</text></g>
<g transform="translate(500 120)"><rect width="205" height="220" rx="22" fill="#2a1a0d" stroke="#f5bb5a"/><path class="sway" d="M103 48 C62 48 56 88 78 98 H128 C150 88 144 48 103 48Z" fill="#f2a746"/><rect x="94" y="96" width="18" height="40" rx="8" fill="#e7d6a8"/><text x="103" y="156" fill="#fff" font-size="20" font-weight="800">SAMGO</text><text x="103" y="184" fill="#d8d0c4" font-size="13">NavisWORLD model identity</text><text x="103" y="208" fill="#f5c66d" font-size="12">experimental family label</text></g>
<g transform="translate(725 120)"><rect width="205" height="220" rx="22" fill="#281127" stroke="#f477c8"/><path class="bob" d="M55 88 Q103 42 150 88 Q113 94 103 129 Q93 94 55 88Z" fill="#ef7ed0"/><circle cx="103" cy="82" r="11" fill="#ffd4f2"/><text x="103" y="156" fill="#fff" font-size="20" font-weight="800">MUSE</text><text x="103" y="184" fill="#d8cce0" font-size="13">model / assistant identity</text><text x="103" y="208" fill="#f5a6dc" font-size="12">distinct from Muse EEG connector</text></g>
<g transform="translate(950 120)"><rect width="205" height="220" rx="22" fill="#282006" stroke="#f7d65f"/><circle class="glow" cx="103" cy="86" r="34" fill="#ffd84d"/><g class="star" stroke="#ffd84d" stroke-width="6"><path d="M103 36v-22M103 158v-22M53 86H31M175 86h-22M67 50L51 34M155 138l-16-16M139 50l16-16M67 122l-16 16"/></g><text x="103" y="156" fill="#fff" font-size="20" font-weight="800">SOL</text><text x="103" y="184" fill="#ded7bd" font-size="13">ecosystem model / assistant identity</text><text x="103" y="208" fill="#f6d86b" font-size="12">role label; capability claims stay scoped</text></g>
</g><g fill="#a9eeff"><circle class="star" cx="72" cy="72" r="3"/><circle class="star" cx="336" cy="54" r="2.5" style="animation-delay:1.2s"/><circle class="star" cx="610" cy="78" r="3" style="animation-delay:2.4s"/><circle class="star" cx="840" cy="55" r="2.5" style="animation-delay:3.1s"/><circle class="star" cx="1112" cy="77" r="3" style="animation-delay:4s"/></g></svg>
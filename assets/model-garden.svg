<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="t d">
<title id="t">NavisWORLD Cosmic Brain Menagerie</title><desc id="d">A whimsical animated menagerie separates NavisWORLD model work RAWRPHOS, PHOS, SAMGO and QC67 Zeref lineage from COSMIC.CYPHER routing, Nebula world identity and an open compatible-model portal around one persistent QBEAST.</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.bob{animation:bob 3.5s ease-in-out infinite;transform-origin:center;transform-box:fill-box}.sway{animation:sway 4.8s ease-in-out infinite;transform-origin:center;transform-box:fill-box}.pulse{animation:pulse 3.2s ease-in-out infinite;transform-origin:center;transform-box:fill-box}.nebula{animation:nebula 7s ease-in-out infinite;transform-origin:center;transform-box:fill-box}.wire{stroke-dasharray:9 11;animation:flow 6s linear infinite}.tw{animation:tw 2.8s ease-in-out infinite}.portal{animation:portal 4s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@keyframes pulse{0%,100%{transform:scale(.96);opacity:.66}50%{transform:scale(1.04);opacity:1}}@keyframes nebula{0%,100%{transform:scale(.95) rotate(-2deg);opacity:.65}50%{transform:scale(1.05) rotate(2deg);opacity:1}}@keyframes flow{to{stroke-dashoffset:-120}}@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}@keyframes portal{0%,100%{opacity:.55}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.bob,.sway,.pulse,.nebula,.wire,.tw,.portal{animation:none!important}}</style>
<defs><radialGradient id="bg"><stop stop-color="#21144b"/><stop offset=".5" stop-color="#09142d"/><stop offset="1" stop-color="#050817"/></radialGradient><filter id="g"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1200" height="690" rx="32" fill="url(#bg)" stroke="#445a87"/><text x="52" y="56" fill="#f5f8ff" font-size="31" font-weight="900">THE COSMIC BRAIN MENAGERIE</text><text x="52" y="86" fill="#99acc9" font-size="15">not every cosmic name is the same kind of thing — and that is the point</text>
<g class="wire" fill="none" stroke="#63e7ff" stroke-width="2.5" opacity=".36"><path d="M600 345L185 205M600 345L425 185M600 345L775 185M600 345L1020 205M600 345L240 520M600 345L750 520M600 345L1008 520"/></g>

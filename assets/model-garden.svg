<g transform="translate(920 470)"><rect class="portal" width="240" height="154" rx="24" fill="#112d2d" stroke="#65e1b3" stroke-width="2" stroke-dasharray="9 8"/><circle cx="120" cy="52" r="30" fill="none" stroke="#65e1b3" stroke-width="4"/><path d="M120 34v36M102 52h36" stroke="#65e1b3" stroke-width="5" stroke-linecap="round"/><text x="120" y="102" text-anchor="middle" fill="#fff" font-size="18" font-weight="900">YOUR MODEL HERE</text><text x="120" y="128" text-anchor="middle" fill="#9defca" font-size="12">compatible Brain Bay adapter</text></g>
<g fill="#d9f8ff"><circle class="tw" cx="50" cy="82" r="3"/><circle class="tw" cx="1130" cy="88" r="4" style="animation-delay:1s"/><circle class="tw" cx="397" cy="329" r="3" style="animation-delay:1.6s"/><circle class="tw" cx="845" cy="350" r="3" style="animation-delay:2.3s"/><circle class="tw" cx="576" cy="648" r="4" style="animation-delay:2.8s"/></g><text x="600" y="666" text-anchor="middle" fill="#aebed7" font-size="14">ONE BEAST • MANY POSSIBLE BRAINS • ROUTERS ARE NOT MODELS • WORLDS ARE NOT CHECKPOINTS</text>

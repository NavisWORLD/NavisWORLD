<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="t d"><title id="t">NavisWORLD animated project constellation</title><desc id="d">Beast Box glows at the center while COSMOS, CST, Synapse OS, Reality Bridge, Living Universe, Python CST, the COSMOS manual, media and Heartlight pulse around it.</desc><style>.wire{stroke-dasharray:7 10;animation:flow 6s linear infinite}.node{animation:pulse 4s ease-in-out infinite;transform-origin:center;transform-box:fill-box}.orbit{animation:orbit 16s linear infinite;transform-origin:600px 240px}.tw{animation:tw 3s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-102}}@keyframes pulse{0%,100%{opacity:.72;transform:scale(.97)}50%{opacity:1;transform:scale(1.03)}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.wire,.node,.orbit,.tw{animation:none!important}}text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}</style><defs><radialGradient id="bg"><stop stop-color="#17133e"/><stop offset=".58" stop-color="#090e25"/><stop offset="1" stop-color="#050817"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="480" rx="28" fill="url(#bg)" stroke="#3b4f7e"/><g class="wire" stroke="#5edff2" opacity=".48" stroke-width="2" fill="none"><path d="M600 240L190 110M600 240L390 80M600 240L815 82M600 240L1020 115M600 240L1040 335M600 240L820 405M600 240L395 408M600 240L160 340M600 240L600 58"/></g><g class="orbit"><circle cx="600" cy="44" r="5" fill="#ffd55d" filter="url(#glow)"/></g><g class="node" transform="translate(495 170)" filter="url(#glow)"><circle cx="105" cy="70" r="66" fill="#391a42" stroke="#f076cf" stroke-width="3"/><text x="105" y="65" text-anchor="middle" fill="#fff" font-size="22" font-weight="900">BEAST BOX</text><text x="105" y="91" text-anchor="middle" fill="#9df2ff" font-size="13">the tiny dragon problem</text></g><g class="node" transform="translate(95 64)"><circle cx="80" cy="45" r="42" fill="#142b42" stroke="#65e7ff"/><text x="80" y="51" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">COSMOS</text></g><g class="node" transform="translate(310 38)" style="animation-delay:.4s"><circle cx="80" cy="45" r="42" fill="#28183f" stroke="#b18cff"/><text x="80" y="51" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">CST</text></g><g class="node" transform="translate(735 40)" style="animation-delay:.8s"><circle cx="80" cy="45" r="42" fill="#102f3a" stroke="#6fe8d6"/><text x="80" y="51" text-anchor="middle" fill="#fff" font-size="15" font-weight="800">SYNAPSE OS</text></g><g class="node" transform="translate(940 70)" style="animation-delay:1.2s"><circle cx="80" cy="45" r="42" fill="#3b2510" stroke="#f2bd59"/><text x="80" y="45" text-anchor="middle" fill="#fff" font-size="13" font-weight="800">REALITY</text><text x="80" y="61" text-anchor="middle" fill="#fff" font-size="13" font-weight="800">BRIDGE</text></g><g class="node" transform="translate(960 290)" style="animation-delay:1.6s"><circle cx="80" cy="45" r="42" fill="#2f1236" stroke="#ec7bd0"/><text x="80" y="45" text-anchor="middle" fill="#fff" font-size="13" font-weight="800">LIVING</text><text x="80" y="61" text-anchor="middle" fill="#fff" font-size="13" font-weight="800">UNIVERSE</text></g><g class="node" transform="translate(740 360)" style="animation-delay:2s"><circle cx="80" cy="45" r="42" fill="#102d37" stroke="#5ce5f0"/><text x="80" y="45" text-anchor="middle" fill="#fff" font-size="13" font-weight="800">PYTHON</text><text x="80" y="61" text-anchor="middle" fill="#fff" font-size="13" font-weight="800">CST</text></g><g class="node" transform="translate(315 360)" style="animation-delay:2.4s"><circle cx="80" cy="45" r="42" fill="#312311" stroke="#f0c061"/><text x="80" y="45" text-anchor="middle" fill="#fff" font-size="13" font-weight="800">COSMOS</text><text x="80" y="61" text-anchor="middle" fill="#fff" font-size="13" font-weight="800">MANUAL</text></g><g class="node" transform="translate(80 295)" style="animation-delay:2.8s"><circle cx="80" cy="45" r="42" fill="#28143b" stroke="#ae87ff"/><text x="80" y="51" text-anchor="middle" fill="#fff" font-size="14" font-weight="800">MEDIA</text></g><g class="node" transform="translate(520 15)" style="animation-delay:3.2s"><circle cx="80" cy="45" r="42" fill="#35152b" stroke="#ff7cac"/><text x="80" y="51" text-anchor="middle" fill="#fff" font-size="14" font-weight="800">HEARTLIGHT</text></g><g fill="#d8f7ff"><circle class="tw" cx="56" cy="190" r="3"/><circle class="tw" cx="1125" cy="225" r="4" style="animation-delay:1s"/><circle class="tw" cx="246" cy="246" r="3" style="animation-delay:1.8s"/><circle class="tw" cx="920" cy="220" r="3" style="animation-delay:2.4s"/></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d">
<title id="t">The NavisWORLD project constellation</title><desc id="d">Beast Box glows in the middle of an animated star map while COSMOS, CST, Synapse OS, Reality Bridge, Living Universe, Python CST, the COSMOS manual, media and Heartlight orbit around it.</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wire{stroke-dasharray:8 11;animation:flow 7s linear infinite}.node{animation:pulse 4.5s ease-in-out infinite;transform-origin:center;transform-box:fill-box}.orbit{animation:orbit 24s linear infinite;transform-origin:600px 315px}.tw{animation:tw 3s ease-in-out infinite}.core{animation:core 4s ease-in-out infinite;transform-origin:center;transform-box:fill-box}@keyframes flow{to{stroke-dashoffset:-114}}@keyframes pulse{0%,100%{opacity:.72;transform:scale(.97)}50%{opacity:1;transform:scale(1.03)}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}@keyframes core{0%,100%{transform:scale(.98)}50%{transform:scale(1.025)}}@media(prefers-reduced-motion:reduce){.wire,.node,.orbit,.tw,.core{animation:none!important}}</style>
<defs><radialGradient id="bg"><stop stop-color="#25154f"/><stop offset=".48" stop-color="#0b1732"/><stop offset="1" stop-color="#050817"/></radialGradient><linearGradient id="coreg" x1="0" x2="1"><stop stop-color="#5ce9ff"/><stop offset=".55" stop-color="#a27eff"/><stop offset="1" stop-color="#f079cc"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1200" height="620" rx="32" fill="url(#bg)" stroke="#405985"/><text x="52" y="58" fill="#f5f8ff" font-size="31" font-weight="900">ONE WEIRD SIDE PROJECT BECAME A CONSTELLATION</text><text x="52" y="88" fill="#98adca" font-size="15">turns out the repositories were not unrelated; they were rooms I kept building around the same questions</text>
<g class="wire" stroke="#61e6f5" stroke-width="2.2" opacity=".38" fill="none"><path d="M600 315L165 150M600 315L380 120M600 315L815 120M600 315L1035 155M600 315L1050 455M600 315L825 520M600 315L385 520M600 315L145 450M600 315L600 90"/></g><g class="orbit"><circle cx="600" cy="78" r="7" fill="#ffd55e" filter="url(#g)"/></g>
<g class="core" transform="translate(485 230)" filter="url(#g)"><circle cx="115" cy="85" r="79" fill="#291447" stroke="url(#coreg)" stroke-width="5"/><path d="M102 62L78 31l39 15 24-20-4 42z" fill="#ff6c35"/><path d="M85 118q7-48 54-48 50 0 58 46l-22 33h-67z" fill="#584039"/><circle cx="165" cy="96" r="7" fill="#ffd24c"/><path d="M101 98L62 111l36 13z" fill="#df5f31"/><text x="115" y="183" text-anchor="middle" fill="#fff" font-size="22" font-weight="900">BEAST BOX</text><text x="115" y="206" text-anchor="middle" fill="#9ddff2" font-size="12">the tiny dragon problem</text></g>
<g font-size="14" font-weight="900" text-anchor="middle"><g class="node" transform="translate(80 105)"><circle cx="85" cy="45" r="45" fill="#153045" stroke="#62e7ff"/><text x="85" y="50" fill="#fff">COSMOS</text></g><g class="node" transform="translate(300 74)" style="animation-delay:.4s"><circle cx="80" cy="45" r="45" fill="#28193f" stroke="#ae8cff"/><text x="80" y="50" fill="#fff">CST</text></g><g class="node" transform="translate(735 74)" style="animation-delay:.8s"><circle cx="80" cy="45" r="45" fill="#123631" stroke="#6be2b7"/><text x="80" y="50" fill="#fff">SYNAPSE OS</text></g><g class="node" transform="translate(950 110)" style="animation-delay:1.2s"><circle cx="85" cy="45" r="45" fill="#3a270e" stroke="#f0bd58"/><text x="85" y="43" fill="#fff">REALITY</text><text x="85" y="60" fill="#fff">BRIDGE</text></g><g class="node" transform="translate(965 410)" style="animation-delay:1.6s"><circle cx="85" cy="45" r="45" fill="#311435" stroke="#eb7ed0"/><text x="85" y="43" fill="#fff">LIVING</text><text x="85" y="60" fill="#fff">UNIVERSE</text></g><g class="node" transform="translate(745 475)" style="animation-delay:2s"><circle cx="80" cy="45" r="45" fill="#12323b" stroke="#59e5f1"/><text x="80" y="43" fill="#fff">PYTHON</text><text x="80" y="60" fill="#fff">CST</text></g><g class="node" transform="translate(305 475)" style="animation-delay:2.4s"><circle cx="80" cy="45" r="45" fill="#352510" stroke="#efbf60"/><text x="80" y="43" fill="#fff">COSMOS</text><text x="80" y="60" fill="#fff">MANUAL</text></g><g class="node" transform="translate(60 405)" style="animation-delay:2.8s"><circle cx="85" cy="45" r="45" fill="#26153a" stroke="#a887ff"/><text x="85" y="50" fill="#fff">MEDIA</text></g><g class="node" transform="translate(520 44)" style="animation-delay:3.2s"><circle cx="80" cy="45" r="45" fill="#35152b" stroke="#ff7cab"/><text x="80" y="50" fill="#fff">HEARTLIGHT</text></g></g>
<g fill="#dbf9ff"><circle class="tw" cx="44" cy="254" r="4"/><circle class="tw" cx="1147" cy="273" r="3" style="animation-delay:.7s"/><circle class="tw" cx="253" cy="326" r="3" style="animation-delay:1.4s"/><circle class="tw" cx="930" cy="319" r="4" style="animation-delay:2.1s"/><circle class="tw" cx="598" cy="575" r="3" style="animation-delay:2.8s"/></g><text x="600" y="592" text-anchor="middle" fill="#a9bad2" font-size="14">ONE UNIVERSE • MANY DOORS • THE REPOS ARE THE MAP</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="t d">
<title id="t">The Beast walks the whole loop</title><desc id="d">A small fire-winged Spark Beast travels through animated portals for Spark, Cage, Brain Bay, Field, Lost COSMOS and Save while keeping the same QBEAST identity.</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.route{stroke-dasharray:12 14;animation:flow 5.5s linear infinite}.beast{animation:walk 15s ease-in-out infinite;transform-origin:center;transform-box:fill-box}.node{animation:pulse 4s ease-in-out infinite;transform-origin:center;transform-box:fill-box}.tw{animation:tw 2.6s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-156}}@keyframes walk{0%{transform:translateX(0) translateY(0)}16%{transform:translateX(175px) translateY(-7px)}32%{transform:translateX(350px) translateY(3px)}48%{transform:translateX(525px) translateY(-7px)}64%{transform:translateX(700px) translateY(3px)}80%,100%{transform:translateX(875px) translateY(-3px)}}@keyframes pulse{0%,100%{transform:scale(.96);opacity:.7}50%{transform:scale(1.04);opacity:1}}@keyframes tw{0%,100%{opacity:.18}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.route,.beast,.node,.tw{animation:none!important}.beast{transform:translateX(350px)}}</style>
<defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#080b1b"/><stop offset=".5" stop-color="#1c1241"/><stop offset="1" stop-color="#071224"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1200" height="260" rx="28" fill="url(#bg)" stroke="#3d5482"/><text x="600" y="40" text-anchor="middle" fill="#eff7ff" font-size="24" font-weight="900">SAME LITTLE MENACE. DIFFERENT ROOM.</text><text x="600" y="66" text-anchor="middle" fill="#8fa7c8" font-size="14">one QBEAST identity • the scenery changes • the Beast does not secretly respawn</text><path class="route" d="M100 150C220 110 250 185 370 150S520 115 620 150S785 188 900 150S1010 118 1110 150" fill="none" stroke="#68e9ff" stroke-width="4" opacity=".58"/>
<g text-anchor="middle" font-size="13" font-weight="900"><g class="node"><circle cx="110" cy="150" r="30" fill="#271d4b" stroke="#aa8dff"/><text x="110" y="204" fill="#eae5ff">SPARK</text></g><g class="node" style="animation-delay:.5s"><circle cx="300" cy="150" r="30" fill="#133545" stroke="#64e8ff"/><text x="300" y="204" fill="#d9fbff">CAGE</text></g><g class="node" style="animation-delay:1s"><circle cx="490" cy="150" r="30" fill="#3a1730" stroke="#ef86cf"/><text x="490" y="204" fill="#ffe7f7">BRAIN BAY</text></g><g class="node" style="animation-delay:1.5s"><circle cx="680" cy="150" r="30" fill="#19372f" stroke="#6ce2b6"/><text x="680" y="204" fill="#dcfff1">FIELD</text></g><g class="node" style="animation-delay:2s"><circle cx="870" cy="150" r="30" fill="#3c2a0f" stroke="#f5c35f"/><text x="870" y="204" fill="#fff0c7">LOST COSMOS</text></g><g class="node" style="animation-delay:2.5s"><circle cx="1060" cy="150" r="30" fill="#142d3f" stroke="#79b9ff"/><text x="1060" y="204" fill="#e3f1ff">SAVE</text></g></g>
<g class="beast" transform="translate(69 105)" filter="url(#g)"><path d="M29 30L8 5l31 12 20-17-4 35z" fill="#ff6d35"/><path d="M19 59q6-30 37-30 34 0 40 30L79 80H38z" fill="#59413a"/><circle cx="73" cy="48" r="6" fill="#ffd24c"/><path d="M29 45L1 54l26 9z" fill="#e15e31"/><rect x="39" y="76" width="21" height="10" rx="4" fill="#7d2d44"/><rect x="64" y="76" width="21" height="10" rx="4" fill="#7d2d44"/></g>
<g fill="#fff0a6"><circle class="tw" cx="185" cy="95" r="4"/><circle class="tw" cx="582" cy="92" r="3" style="animation-delay:1s"/><circle class="tw" cx="790" cy="222" r="4" style="animation-delay:1.8s"/><circle class="tw" cx="1130" cy="90" r="3" style="animation-delay:2.3s"/></g></svg>
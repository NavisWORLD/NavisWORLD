<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" role="img" aria-labelledby="t d"><title id="t">One Beast moving through the Beast Box journey</title><desc id="d">A tiny fire-winged Spark Beast moves along a glowing route from Spark to Cage to Brain Bay to Lost COSMOS to Save, representing continuous QBEAST identity.</desc><style>.route{stroke-dasharray:10 12;animation:flow 5s linear infinite}.beast{animation:walk 12s ease-in-out infinite;transform-origin:center;transform-box:fill-box}.node{animation:pulse 3.6s ease-in-out infinite}.spark{animation:twinkle 2.8s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-132}}@keyframes walk{0%{transform:translateX(0) translateY(0)}20%{transform:translateX(210px) translateY(-8px)}40%{transform:translateX(420px) translateY(2px)}60%{transform:translateX(630px) translateY(-8px)}80%,100%{transform:translateX(840px) translateY(0)}}@keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.route,.beast,.node,.spark{animation:none!important}.beast{transform:translateX(420px)}}text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}</style><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#070b19"/><stop offset=".5" stop-color="#17113b"/><stop offset="1" stop-color="#090b20"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="180" rx="24" fill="url(#bg)" stroke="#394d78"/><path class="route" d="M115 92H1085" stroke="#68e9ff" stroke-width="4" fill="none" opacity=".65"/><g text-anchor="middle" font-size="14" font-weight="800" fill="#dfeaff"><g class="node"><circle cx="120" cy="92" r="22" fill="#28204d" stroke="#b795ff"/><text x="120" y="144">SPARK</text></g><g class="node" style="animation-delay:.5s"><circle cx="330" cy="92" r="22" fill="#153047" stroke="#62e7ff"/><text x="330" y="144">CAGE</text></g><g class="node" style="animation-delay:1s"><circle cx="540" cy="92" r="22" fill="#3a1732" stroke="#f28ad2"/><text x="540" y="144">BRAIN BAY</text></g><g class="node" style="animation-delay:1.5s"><circle cx="750" cy="92" r="22" fill="#3a2710" stroke="#f5c75f"/><text x="750" y="144">LOST COSMOS</text></g><g class="node" style="animation-delay:2s"><circle cx="960" cy="92" r="22" fill="#123629" stroke="#66e3b4"/><text x="960" y="144">SAVE</text></g></g><g class="beast" transform="translate(78 50)" filter="url(#g)"><path d="M28 30L10 7l27 11 18-15-3 29z" fill="#ff6c35"/><path d="M20 54q5-24 31-24 29 0 34 25L72 71H37z" fill="#5b443c"/><circle cx="65" cy="44" r="5" fill="#ffd24c"/><path d="M28 42L4 49l22 7z" fill="#e45f31"/><rect x="35" y="67" width="20" height="10" rx="4" fill="#7b2b41"/><rect x="59" y="67" width="20" height="10" rx="4" fill="#7b2b41"/></g><g fill="#fff0a1"><circle class="spark" cx="190" cy="36" r="3"/><circle class="spark" cx="690" cy="39" r="4" style="animation-delay:1s"/><circle class="spark" cx="1088" cy="60" r="3" style="animation-delay:1.8s"/></g><text x="600" y="28" text-anchor="middle" fill="#8fa6ca" font-size="13">ONE QBEAST IDENTITY • DIFFERENT ROOMS • NO SECRET RESPAWN</text></svg>